[tool.bumpversion]
current_version = "0.20.0-dev.1"
# Stable versions are X.Y.Z. Next-channel pre-releases are X.Y.Z-dev.N and
# carry the unstable interface versions (UNSTABLE_VERSIONS in generate.yml).
# See "Release process" in README.md.
parse = """(?x)
    (?P<major>0|[1-9]\\d*)\\.
    (?P<minor>0|[1-9]\\d*)\\.
    (?P<patch>0|[1-9]\\d*)
    (?:-(?P<pre_l>dev)\\.(?P<pre_n>[1-9]\\d*))?
"""
serialize = [
    "{major}.{minor}.{patch}-{pre_l}.{pre_n}",
    "{major}.{minor}.{patch}",
]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
tag = false
sign_tags = false
tag_name = "v{new_version}"
allow_dirty = false
commit = false
message = "release: v{new_version}"
commit_args = ""

# `final` is the implicit label of a stable version. Bumping major, minor or
# patch starts a pre-release cycle at -dev.1; bumping pre_l ends it.
[tool.bumpversion.parts.pre_l]
values = ["dev", "final"]
optional_value = "final"

[tool.bumpversion.parts.pre_n]
first_value = "1"

[[tool.bumpversion.files]]
filename = "gen/rust/Cargo.toml"

[[tool.bumpversion.files]]
filename = "gen/node/package.json"

[[tool.bumpversion.files]]
filename = "gen/jsonschema/package.json"

[[tool.bumpversion.files]]
filename = "gen/typebox/package.json"

[[tool.bumpversion.files]]
filename = "gen/dotnet/Utxorpc.Spec.csproj"

# PEP 440 spells the same development release X.Y.Z.devN, which pip skips
# unless asked for.
[[tool.bumpversion.files]]
filename = "gen/python/pyproject.toml"
serialize = [
    "{major}.{minor}.{patch}.{pre_l}{pre_n}",
    "{major}.{minor}.{patch}",
]

# Cabal versions are numeric only, and the next channel does not upload to
# Hackage, so the cabal file holds the base version (0.0.X.Y.Z) throughout a
# cycle.
[[tool.bumpversion.files]]
filename = "gen/haskell/utxorpc.cabal"
serialize = ["{major}.{minor}.{patch}"]
