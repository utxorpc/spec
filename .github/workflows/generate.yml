name: "Run Buf Code Generation"

on:
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        description: "'stable' leaves out the unstable versions, 'next' generates everything"
        options: [stable, next]
        default: stable
      version:
        type: string
        description: "next channel only: pre-release tag to stamp, e.g. v0.20.0-next.1"
        required: false
  workflow_call:
    inputs:
      channel:
        type: string
        description: "'stable' leaves out the unstable versions, 'next' generates everything"
        default: stable
      version:
        type: string
        description: "next channel only: pre-release tag to stamp, e.g. v0.20.0-next.1"
        required: false
        default: ""

env:
  # Interface versions still under construction, i.e. allowed to break. Stable
  # releases leave them out of every package; they ship only in the next
  # channel's `vX.Y.Z-next.N` pre-releases. This is the single list: freezing a
  # version means removing it from here and cutting a stable release. See
  # "Unstable versions and pre-releases" in README.md.
  UNSTABLE_VERSIONS: "v1"

jobs:
  codegen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Exports BUF_EXCLUDES (the --exclude-path flags for buf) and
      # INCLUDED_VERSIONS (the interface versions this build ships) for the
      # steps below.
      - name: Select channel
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          excluded=""
          case "$CHANNEL" in
            stable)
              .github/scripts/prune-unstable.sh $UNSTABLE_VERSIONS
              excluded="$UNSTABLE_VERSIONS"
              ;;
            next) ;;
            *) echo "unknown channel '$CHANNEL'" >&2; exit 1 ;;
          esac

          excludes=""
          included=""
          for dir in proto/utxorpc/*/; do
            v=$(basename "$dir")
            if [[ " $excluded " == *" $v "* ]]; then
              excludes="$excludes --exclude-path proto/utxorpc/$v"
            else
              included="$included $v"
            fi
          done

          echo "channel $CHANNEL ships:$included"
          echo "BUF_EXCLUDES=${excludes# }" >> "$GITHUB_ENV"
          echo "INCLUDED_VERSIONS=${included# }" >> "$GITHUB_ENV"

      # Pull requests and dry-runs have no tag; they stamp a placeholder so the
      # stamping itself is exercised.
      - name: Stamp pre-release version
        if: inputs.channel == 'next'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ -z "$VERSION" ]]; then
            current=$(sed -nE 's/^current_version = "([^"]+)"$/\1/p' .bumpversion.toml)
            VERSION="v$current-next.0"
          fi
          .github/scripts/stamp-prerelease.sh "$VERSION"

      - name: Install protoc
        run: |
          PROTOC_ZIP=protoc-3.14.0-linux-x86_64.zip
          curl -OL https://github.com/protocolbuffers/protobuf/releases/download/v3.14.0/$PROTOC_ZIP
          unzip -o $PROTOC_ZIP -d . bin/protoc
          unzip -o $PROTOC_ZIP -d . 'include/*'
          rm -f $PROTOC_ZIP
          echo "$(pwd)/bin" >> "$GITHUB_PATH"

      - name: Setup npm
        uses: actions/setup-node@v7
        with:
          node-version: 20.11.0
          cache: "npm"
          cache-dependency-path: "buf.gen.yaml"

      - name: Install node protoc plugins
        run: |
          npm install -g @bufbuild/protoc-gen-es@v1.10 @connectrpc/protoc-gen-connect-es@v1.4

      - name: Install Prost from Cargo
        uses: baptiste0928/cargo-install@v3
        with:
          crate: protoc-gen-prost
          version: 0.3.1

      - name: Install protoc-gen-prost-crate from Cargo
        uses: baptiste0928/cargo-install@v3
        with:
          crate: protoc-gen-prost-crate
          version: 0.4.0

      - name: Install Prost serde from Cargo
        uses: baptiste0928/cargo-install@v3
        with:
          crate: protoc-gen-prost-serde
          version: 0.3.0

      - name: Install Tonic from Cargo
        uses: baptiste0928/cargo-install@v3
        with:
          crate: protoc-gen-tonic
          version: 0.4.0

      - name: Setup Haskell
        uses: ./.github/actions/setup-proto-lens-protoc

      - name: Install Buf from npm
        run: npm install -g @bufbuild/buf

      - name: Generate code
        run: buf generate proto $BUF_EXCLUDES

      # The C# generators emit flat files named after the proto basename, so
      # each interface version runs as its own buf invocation (see the note in
      # buf.gen.yaml).
      - name: Generate dotnet
        run: |
          for v in $INCLUDED_VERSIONS; do
            buf generate --template "buf.gen.dotnet.$v.yaml"
          done

      # The protobuf Python plugin emits absolute imports rooted at the proto
      # package (e.g. `from utxorpc.v1alpha...`), which do not resolve once the
      # code is packaged under `utxorpc_spec`. protoletariat rewrites the
      # proto-generated imports to relative imports so the single utxorpc-spec
      # package works regardless of where it is mounted. It reads a descriptor
      # set built with the same excludes as the generation above, so it only
      # visits files that were generated.
      - name: Fix python imports
        run: |
          pipx install protoletariat
          buf build proto $BUF_EXCLUDES -o "$RUNNER_TEMP/descriptors.binpb"
          protol \
            --create-package \
            --in-place \
            --exclude-google-imports \
            --python-out gen/python/utxorpc_spec \
            raw "$RUNNER_TEMP/descriptors.binpb"

      - name: Smoke-test python imports
        run: |
          pip install --quiet protobuf grpcio
          cd gen/python
          for v in $INCLUDED_VERSIONS; do
            python -c "import utxorpc_spec.utxorpc.$v.sync.sync_pb2; print('python import OK: $v')"
          done

      - name: Create codegen artifact
        uses: actions/upload-artifact@v7
        with:
          name: codegen-${{ inputs.channel }}
          path: "gen/**"
