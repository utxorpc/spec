name: "Release"

# Triggered by the tag that bump-my-version creates (see "Release process" in
# README.md). A plain `vX.Y.Z` tag is a stable release: the unstable interface
# versions are left out. A `vX.Y.Z-dev.N` tag is a next-channel pre-release:
# everything is generated and each registry publishes it as a pre-release.
# generate.yml rejects a tag that differs from the committed version.

on:
  workflow_dispatch:
  push:
    tags: [v*]

jobs:
  generate:
    uses: ./.github/workflows/generate.yml
    with:
      channel: ${{ github.ref_type == 'tag' && contains(github.ref_name, '-') && 'next' || 'stable' }}
      version: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

  publish-dry-run:
    needs: [generate]
    uses: ./.github/workflows/publish-all.yml
    secrets: inherit
    with:
      mode: "dry-run"
      channel: ${{ github.ref_type == 'tag' && contains(github.ref_name, '-') && 'next' || 'stable' }}

  publish:
    needs: [publish-dry-run]
    uses: ./.github/workflows/publish-all.yml
    secrets: inherit
    with:
      mode: "release"
      channel: ${{ github.ref_type == 'tag' && contains(github.ref_name, '-') && 'next' || 'stable' }}

  # PyPI trusted publishing (OIDC) cannot run inside a reusable workflow, so
  # unlike the other registries this upload lives here rather than in
  # publish-all.yml. The PyPI trusted publisher for utxorpc-spec names this
  # file, release.yml. Tag pushes only: a manual run on a branch has no
  # version to publish.
  publish-pypi:
    needs: [publish-dry-run]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: codegen-${{ contains(github.ref_name, '-') && 'next' || 'stable' }}
          path: ./codegen

      - uses: ./.github/actions/publish-python
        with:
          mode: build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: codegen/python/dist/
