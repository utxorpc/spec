name: "Release"

# A plain `vX.Y.Z` tag is a stable release: the unstable interface versions are
# left out. A `vX.Y.Z-next.N` tag is a next-channel pre-release: everything is
# generated and each registry publishes it as a pre-release. Any other
# hyphenated tag is rejected when the version is stamped. See "Unstable
# versions and pre-releases" in README.md.

on:
  workflow_dispatch:
  push:
    tags: [v*]

jobs:
  generate:
    uses: ./.github/workflows/generate.yml
    with:
      channel: ${{ github.ref_type == 'tag' && contains(github.ref_name, '-') && 'next' || 'stable' }}
      version: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

  publish-dry-run:
    needs: [generate]
    uses: ./.github/workflows/publish-all.yml
    secrets: inherit
    with:
      mode: "dry-run"
      channel: ${{ github.ref_type == 'tag' && contains(github.ref_name, '-') && 'next' || 'stable' }}

  publish:
    needs: [publish-dry-run]
    uses: ./.github/workflows/publish-all.yml
    secrets: inherit
    with:
      mode: "release"
      channel: ${{ github.ref_type == 'tag' && contains(github.ref_name, '-') && 'next' || 'stable' }}
