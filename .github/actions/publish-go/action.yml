name: 'publish go'
description: 'Pushes go code to the sdk repo'
inputs:
  repository-token:
    description: token for git authentication
    required: false
  mode:
    description: supported values are 'release' and 'dry-run'
    required: true
  channel:
    description: "'stable' or 'next'; next pushes only the tag, never main"
    required: false
    default: stable

runs:
  using: 'composite'
  steps:
   
    - name: Set up Go 1.26.x
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: 1.26.x
        check-latest: true

    - name: Validate release token
      if: inputs.mode == 'release' && inputs.repository-token == ''
      shell: bash
      run: |
        echo "repository-token is required in release mode" >&2
        exit 1

    - name: Attempt Build
      working-directory: codegen/go
      shell: bash
      run: |
        go get -v -t -d ./...
        go build -v ./...
        go test ./...

    - name: Set up Go 1.27.x
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: 1.27.x
        check-latest: true

    - name: Test with Go 1.27.x
      working-directory: codegen/go
      shell: bash
      run: |
        go build -v ./...
        go test ./...

    - uses: actions/checkout@v7
      with:
        repository: utxorpc/go-codegen
        fetch-depth: 0
        token: ${{ inputs.repository-token || github.token }}
        path: go-codegen

    - name: Copy new spec
      shell: bash
      run: |
        rm -Rf go-codegen/utxorpc
        mv codegen/go/* go-codegen/

    # A next-channel pre-release pushes only its tag. The tagged commit sits on
    # no branch, which the Go module proxy resolves fine, and `@latest` never
    # selects a pre-release tag, so go-codegen's main keeps tracking the
    # stable channel.
    - name: Publish
      if: inputs.mode == 'release'
      shell: bash
      env:
        CHANNEL: ${{ inputs.channel }}
      run: |
        cd go-codegen
        RELEASE_VERSION=${GITHUB_REF#refs/*/}
        git config --global --add safe.directory `pwd -P`
        git config --global user.email "wolf31o2@blinklabs.io"
        git config --global user.name "Chris Gianelloni (bot)"
        git add .
        git commit --allow-empty -m "GHA: automatic publish: ${RELEASE_VERSION}"
        if [[ ${CHANNEL} == next ]]; then
          if [[ ${RELEASE_VERSION} != v*-next.* ]]; then
            echo "next channel needs a vX.Y.Z-next.N tag, got '${RELEASE_VERSION}'" >&2
            exit 1
          fi
          git tag ${RELEASE_VERSION}
          git push origin ${RELEASE_VERSION}
          exit 0
        fi
        git push origin HEAD:main
        if [[ ${RELEASE_VERSION} == v* ]]; then
          git tag ${RELEASE_VERSION}
          git push origin ${RELEASE_VERSION}
        fi
