name: "Publish python"
description: 'Validates or builds the python package; the PyPI upload runs in release.yml'
inputs:
  mode:
    description: >-
      'dry-run' validates the package without contacting PyPI; 'build' writes
      the sdist and wheel to codegen/python/dist for release.yml to upload.
    required: true

# PyPI trusted publishing cannot run inside a reusable workflow
# (https://docs.pypi.org/trusted-publishers/troubleshooting/, warehouse#11096),
# and pypa/gh-action-pypi-publish cannot run inside a composite action. So this
# action never uploads: release.yml calls it with mode 'build' and runs the
# upload itself, in its own top-level `publish-pypi` job.

runs:
  using: 'composite'
  steps:

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.10"

    - name: Install Poetry
      shell: bash
      run: pip install --no-input poetry

    - name: Publish dry run
      if: inputs.mode == 'dry-run'
      working-directory: codegen/python
      shell: bash
      run: |
        poetry publish --build --dry-run

    - name: Build
      if: inputs.mode == 'build'
      working-directory: codegen/python
      shell: bash
      run: |
        poetry build
